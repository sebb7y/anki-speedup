<div id="speedup-deck-options">
  <p class="text-muted">
    Timings are in seconds and may be fractional (e.g. <code>2.7</code>). A value
    of <code>0</code> disables that timer.
  </p>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" id="speedup-enabled" />
    <label class="form-check-label" for="speedup-enabled">
      Enable Speedup timers for this preset
    </label>
  </div>
  <div id="speedup-classes"></div>
</div>
